name: Build V2GET APK (Cloud CI)

on:
  workflow_dispatch: # امکان اجرا با یک کلیک از تب Actions با گوشی
  push:
    branches:
      - main
      - my-releases

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Build Dependencies (CMake & Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm-dev libclang-dev

      - name: Compile Aether Core Binary (libaether.so)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export NDK_HOME=$ANDROID_NDK
          chmod +x ./compile-aether.sh
          ./compile-aether.sh

      - name: Compile HEV SOCKS5 Tunnel (libhev-socks5-tunnel.so)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export NDK_HOME=$ANDROID_NDK
          chmod +x ./compile-hevtun.sh
          ./compile-hevtun.sh

      - name: Copy Native Libraries to JniLibs
        run: |
          mkdir -p V2rayNG/app/src/main/jniLibs
          cp -r libs-aether/* V2rayNG/app/src/main/jniLibs/ || true
          cp -r hev-socks5-tunnel/libs/* V2rayNG/app/src/main/jniLibs/ || true

      - name: Update Branding & App Name to V2GET
        run: |
          # تغییر نام برنامه به V2GET در منابع اندروید
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">V2GET<\/string>/g' V2rayNG/app/src/main/res/values/strings.xml || true

      - name: Build Playstore Debug APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2GET-Android-APK
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          retention-days: 7
